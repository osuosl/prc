name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional commit format
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged, so the PR title becomes the commit subject on
      # main -- which is what release-please parses. An unconventional title
      # silently drops the change out of the changelog, so it is checked here
      # rather than discovered at release time.
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            build
            ci
            refactor
            test
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid: start lowercase and do not end
            with a period. For example: "fix: reclaim auth slots on disconnect"
